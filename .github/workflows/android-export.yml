name: "Build Android APK"
 
on:
  push:
    branches: [main]
  workflow_dispatch: {}
 
env:
  GODOT_VERSION: 4.2
  EXPORT_NAME: BRGame
 
jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
 
      - name: Setup templates & debug keystore
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.config/godot ~/.config/godot || true
          mkdir -v -p build/android
 
      - name: Point Godot to the debug keystore
        run: |
          sed -i 's@keystore/debug=".*"@keystore/debug="/root/debug.keystore"@' export_presets.cfg
          sed -i 's@keystore/debug_user=".*"@keystore/debug_user="androiddebugkey"@' export_presets.cfg
          sed -i 's@keystore/debug_password=".*"@keystore/debug_password="android"@' export_presets.cfg
 
      - name: Import project (generates .godot cache)
        run: godot --headless --verbose --import
 
      - name: Export Android Debug APK
        run: godot --headless --verbose --export-debug "Android Debug" "build/android/${EXPORT_NAME}-debug.apk"
 
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/android/${{ env.EXPORT_NAME }}-debug.apk
          retention-days: 30
 
